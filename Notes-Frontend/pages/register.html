<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Register | VB Notes</title>

<link rel="stylesheet"
href="../assets/bootstrap/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="../assets/css/register.css">

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- LEFT -->

<div class="col-md-7 hidden-sm hidden-xs left-panel">

<div class="overlay">

<div class="brand">

<i class="fa-solid fa-note-sticky"></i>

<h1>VB Notes</h1>

<p>

Create your account and keep your notes safe everywhere.

</p>

</div>

</div>

</div>

<!-- RIGHT -->

<div class="col-xs-12 col-sm-12 col-md-5 right-panel">

<div class="register-card">

<div class="text-center">

<i class="fa-solid fa-user-plus register-icon"></i>

<h2>Create Account</h2>

<p>Fill the details below</p>

</div>

<form id="registerForm">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
id="fullName"
class="form-control"
placeholder="Enter Full Name"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="form-group">

<label>Mobile</label>

<input
type="text"
id="mobile"
class="form-control"
placeholder="Enter Mobile Number"
maxlength="10"
required>

</div>

<div class="form-group">

<label>Password</label>

<div class="input-group">

<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>

<span
class="input-group-addon"
id="togglePassword">

<i class="fa fa-eye"></i>

</span>

</div>

</div>

<button
type="submit"
class="btn btn-success btn-block register-btn">

Register

</button>

</form>

<hr>

<div class="text-center">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

</div>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../assets/bootstrap/js/bootstrap.min.js"></script>

<script src="../assets/js/register.js"></script>

</body>
</html>
